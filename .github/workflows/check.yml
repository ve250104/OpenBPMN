name: Check development build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - name: Record rendering environment
        run: |
          mkdir -p .artifacts
          node --version | tee .artifacts/node-version.txt
          /usr/bin/google-chrome --version | tee .artifacts/browser-version.txt
          uname -srm | tee .artifacts/os-version.txt
      - run: npm test
      - run: npm run test:integration
      - name: Installed archive and isolated network smoke
        run: npm run test:package
        env:
          BPMN_WEAVE_BROWSER_EXECUTABLE: /usr/bin/google-chrome
          BPMN_WEAVE_TEST_NETWORK_NAMESPACE: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-development-evidence
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
